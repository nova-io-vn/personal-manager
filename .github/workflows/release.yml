name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Use tested npm version
        run: npm install --global npm@10.9.7
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          npm.cmd version $version --no-git-tag-version --prefix frontend
          npm.cmd version $version --no-git-tag-version --prefix desktop
      - name: Install backend test dependencies
        working-directory: backend
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Backend tests
        working-directory: backend
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build
      - name: Playwright end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/Personal-Manager-Setup-${{ steps.version.outputs.version }}.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Use tested npm version
        run: npm install --global npm@10.9.7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install frontend dependencies and build web assets
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Prepare Android release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing Android signing secrets: $($missing -join ', ')"
          }

          $path = Join-Path $PWD 'frontend\android\app\release.keystore'
          try {
            $encoded = $env:ANDROID_KEYSTORE_BASE64 -replace '\s', ''
            $bytes = [Convert]::FromBase64String($encoded)
          } catch {
            throw 'ANDROID_KEYSTORE_BASE64 is not valid Base64. Recreate it from the binary .jks file.'
          }
          if ($bytes.Length -lt 1000) {
            throw "Decoded Android keystore is unexpectedly small ($($bytes.Length) bytes). Recreate ANDROID_KEYSTORE_BASE64."
          }
          [IO.File]::WriteAllBytes($path, $bytes)

          & keytool -list -keystore $path -storepass $env:ANDROID_KEYSTORE_PASSWORD -alias $env:ANDROID_KEY_ALIAS | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Android keystore validation failed. Check the Base64, store password, and alias secrets.'
          }

          "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
          Write-Host "Android signing keystore validated ($($bytes.Length) bytes)."
      - name: Build Android APK
        shell: pwsh
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          .\gradlew.bat assembleRelease "-PpmVersionName=$version" "-PpmVersionCode=${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle release build failed with exit code $LASTEXITCODE."
          }
          $apk = 'app\build\outputs\apk\release\app-release.apk'
          if (-not (Test-Path -LiteralPath $apk)) {
            throw "Expected release APK was not produced at $apk."
          }
          Copy-Item -LiteralPath $apk -Destination "..\Personal-Manager-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/Personal-Manager-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*
            artifacts/android-apk/*
          generate_release_notes: true
          make_latest: true
